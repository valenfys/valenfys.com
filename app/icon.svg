<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <!-- A red vinyl record. The gap inside the rim, a groove and the spindle hole are cut out so the tab shows through, and the
       label contrasts with the tab bar (black in light mode, white in dark mode) so the hole stays visible. -->
  <style>
    .label { fill: #1d1d1f; }
    @media (prefers-color-scheme: dark) { .label { fill: #f2f2f0; } }
  </style>
  <mask id="cutouts">
    <circle cx="18" cy="18" r="18" fill="#fff" />
    <circle cx="18" cy="18" r="15" fill="none" stroke="#000" stroke-width="2" />
    <circle cx="18" cy="18" r="10.5" fill="none" stroke="#000" stroke-width="2" />
    <circle cx="18" cy="18" r="1.5" fill="#000" />
  </mask>
  <g mask="url(#cutouts)">
    <circle cx="18" cy="18" r="18" fill="#e03a3e" />
    <circle class="label" cx="18" cy="18" r="6.5" />
  </g>
</svg>

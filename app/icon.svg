<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <!-- A red vinyl record with a mid-grey label. The gap inside the rim and the spindle hole are cut out so the tab
       shows through, which keeps it legible on light and dark tab bars. -->
  <mask id="cutouts">
    <circle cx="18" cy="18" r="18" fill="#fff" />
    <circle cx="18" cy="18" r="15" fill="none" stroke="#000" stroke-width="2" />
    <circle cx="18" cy="18" r="1.5" fill="#000" />
  </mask>
  <g mask="url(#cutouts)">
    <circle cx="18" cy="18" r="18" fill="#e03a3e" />
    <circle cx="18" cy="18" r="6.5" fill="#8e8e93" />
  </g>
</svg>
